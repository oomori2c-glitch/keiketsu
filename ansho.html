</main><script>
const DATA=[{"code":"GV1","name":"長強","meridian":"督脈","location":"会陰部、尾骨の下方、尾骨端と肛門の中央。","method":"伏臥位あるいは膝胸位にし、尾骨の下方で肛門との間に取る。","related":""},{"code":"GV2","name":"腰兪","meridian":"督脈","location":"仙骨部、後正中線上、仙骨裂孔。","method":"殿裂の直上に仙骨裂孔を触れ、その陥凹中に取る。","related":""},{"code":"GV3","name":"腰陽関","meridian":"督脈","location":"腰部、後正中線上、第４腰椎棘突起下方の陥凹部。","method":"第４・第５腰椎棘突起間に取る。","related":"ヤコビー線と正中線の交点が第４腰椎棘突起にあたる。"},{"code":"GV4","name":"命門","meridian":"督脈","location":"腰部、後正中線上、第２腰椎棘突起下方の陥凹部。","method":"第２・第３腰椎棘突起間に取る。","related":"第12肋骨の先端を結んだ線と正中線の交点にあたる。"},{"code":"GV5","name":"懸枢","meridian":"督脈","location":"腰部、後正中線上、第１腰椎棘突起下方の陥凹部。","method":"第１・第２腰椎棘突起間に取る。","related":""},{"code":"GV6","name":"脊中","meridian":"督脈","location":"上背部、後正中線上、第11胸椎棘突起下方の陥凹部。","method":"第11・第12胸椎棘突起間に取る。","related":"命門を定め、これを基準にする。"},{"code":"GV7","name":"中枢","meridian":"督脈","location":"上背部、後正中線上、第10胸椎棘突起下方の陥凹部。","method":"第10・第11胸椎棘突起間に取る。","related":"至陽を定め、これを基準とする。"},{"code":"GV8","name":"筋縮","meridian":"督脈","location":"上背部、後正中線上、第９胸椎棘突起下方の陥凹部。","method":"第９・第10胸椎棘突起間に取る。","related":"至陽を定め、これを基準にする。"},{"code":"GV9","name":"至陽","meridian":"督脈","location":"上背部、後正中線上、第７胸椎棘突起下方の陥凹部。","method":"第７・第８胸椎棘突起間に取る。","related":"左右の肩甲骨下角を結ぶ線と正中線の交点にあたる。"},{"code":"GV10","name":"霊台","meridian":"督脈","location":"上背部、後正中線上、第６胸椎棘突起下方の陥凹部。","method":"第６・第７胸椎棘突起間に取る。","related":"至陽を定め、これを基準にする。"},{"code":"GV11","name":"神道","meridian":"督脈","location":"上背部、後正中線上、第５胸椎棘突起下方の陥凹部。","method":"第５・第６胸椎棘突起間に取る。","related":"至陽を定め、これを基準にする。"},{"code":"GV12","name":"身柱","meridian":"督脈","location":"上背部、後正中線上、第３胸椎棘突起下方の陥凹部。","method":"第３・第４胸椎棘突起間に取る。","related":"左右の肩甲棘内端を結ぶ線と脊柱との交点が第３胸椎極突起に当たる。"},{"code":"GV13","name":"陶道","meridian":"督脈","location":"上背部、後正中線上、第１胸椎棘突起下方の陥凹部。","method":"第１・第２胸椎棘突起間に取る。","related":"大椎を定め、これを基準にする。"},{"code":"GV14","name":"大椎","meridian":"督脈","location":"後頸部、後正中線上、第７頸椎棘突起下方の陥凹部。","method":"第７頚椎棘突起と第１胸椎棘突起間に取る。","related":"頭を前屈し,最も突出する棘突起が第７頸椎棘突起である。"},{"code":"GV15","name":"瘂門","meridian":"督脈","location":"後頸部、後正中線上、第２頸椎棘突起上方の陥凹部。","method":"項窩のほぼ中央で後髪際の上方、風府の下方５分に取る。","related":""},{"code":"GV16","name":"風府","meridian":"督脈","location":"後頸部、後正中線上、外勾等隆起の直下、左右の僧帽筋間の陥凹部。","method":"頸部を軽く屈曲させて僧帽筋の緊張を緩め、後髪際中央から後頭骨に向かって撫で上げた時、指が止まる所に取る。","related":""},{"code":"GV17","name":"脳戸","meridian":"督脈","location":"頭部、外後頭隆起上方の陥凹部。","method":"外後頭隆起上際の陥凹中に取る。","related":""},{"code":"GV18","name":"強間","meridian":"督脈","location":"頭部、後正中線上、後髪際の上方４寸。","method":"脳戸の上方１寸５分、脳戸と百会とを結ぶ線を３等分し、脳戸から１／３の所に取る。","related":"新生児では小泉門部に当たる。"},{"code":"GV19","name":"後頂","meridian":"督脈","location":"頭部、後正中線上、後髪際の上方５寸５分。","method":"脳戸の上方３寸、脳戸と百会を結ぶ線を３等分し、百会から１／３の所に取る。","related":""},{"code":"GV20","name":"百会","meridian":"督脈","location":"頭部、前正中線上、前髪際の後方５寸。","method":"左右の耳介を前に折り、その上角を結ぶ腺の中点に取る。","related":"前髪際と後髪際とを結ぶ線の中点の前方１寸に当たる。"},{"code":"GV21","name":"前頂","meridian":"督脈","location":"頭部、前正中線上、前髪際の後方３寸５分。","method":"百会の前方１寸５分、百会と神庭とを結ぶ線を３等分し、百会から１／３の所に取る。","related":""},{"code":"GV22","name":"顖会","meridian":"督脈","location":"頭部、前正中線上、前髪際の後方２寸。","method":"百会の前方３寸、百会と神庭とを結ぶ線を３等分し、神庭から１／３の所に取る。","related":"新生児では大泉門部に当たる。"},{"code":"GV23","name":"上星","meridian":"督脈","location":"頭部、前正中線上、前髪際の後方１寸。","method":"顖会の前方で前髪際との中点に取る。","related":""},{"code":"GV24","name":"神庭","meridian":"督脈","location":"頭部、前正中線上、前髪際の後方５分。","method":"前髪際がはっきりしない場合は、眉間中央の上方３寸５分に取る。","related":""},{"code":"GV25","name":"素髎","meridian":"督脈","location":"顔面部、鼻の尖端。","method":"鼻尖の中央で、指頭で押しと特に窪む所に取る。","related":""},{"code":"GV26","name":"水溝","meridian":"督脈","location":"顔面部、人中溝の中点。＜別説＞顔面部、人中溝の上から１／３。","method":"前正中線上で、鼻中隔直下と上唇結節との中点に取る。＜別説＞鼻中隔直下から上唇に向かって１／３の所に取る。","related":""},{"code":"GV27","name":"兌端","meridian":"督脈","location":"顔面部、上唇結節の中点。","method":"上唇の中央で皮膚と粘膜との移行部に取る。","related":""},{"code":"GV28","name":"齦交","meridian":"督脈","location":"顔面部、上歯齦、上唇小帯の接合部。","method":"上唇を上げ、上唇小帯と歯齦との移行部に取る。","related":""},{"code":"CV1","name":"会陰","meridian":"任脈","location":"会陰部、男性は陰嚢根部と肛門を結ぶ線の中点。女性は後陰唇交連と肛門を結ぶ線の中点。","method":"会陰部の中央．","related":""},{" に取る。","related":""},{"code":"LR14","name":"期門","meridian":"足の厥陰肝経","location":"前胸部、第６肋間、前正中線の外方５寸。","method":"乳頭中央の下方で、乳根（胃経）の１肋間、下に取る。","related":"巨闕（任脈）の外方４寸に当たる。　　・女性では鎖骨中線と第７肋間の交点に取る。"}];
const ORDER=['LU','LI','ST','SP','HT','SI','BL','KI','PC','TE','GB','LR','GV','CV'];
const LABELS={LU:'手の太陰肺経',LI:'手の陽明大腸経',ST:'足の陽明胃経',SP:'足の太陰脾経',HT:'手の少陰心経',SI:'手の太陽小腸経',BL:'足の太陽膀胱経',KI:'足の少陰腎経',PC:'手の厥陰心包経',TE:'手の少陽三焦経',GB:'足の少陽胆経',LR:'足の厥陰肝経',GV:'督脈',CV:'任脈'};
function el(id){return document.getElementById(id);}
var groups={},current='LU',index=0,reveal=false,started=false;
for(var a=0;a<ORDER.length;a++){var k=ORDER[a];groups[k]=DATA.filter(function(p){return p.code.slice(0,k.length)===k && /^\d+$/.test(p.code.slice(k.length));});}
function draw(){
 var list=groups[current],p=list[index];
 el('meridian').value=current;el('meridianName').textContent=LABELS[current];
 el('prev').disabled=!started||index===0;el('next').disabled=!started||index===list.length-1;
 el('toggle').disabled=!started;el('shuffleNext').disabled=!started;
 el('details').textContent='';
 if(!started){el('counter').textContent='開始前';el('name').textContent='スタートを押してください';el('code').textContent='';el('progress').style.width='0%';el('toggle').textContent='取穴説明を表示';return;}
 el('counter').textContent=(index+1)+' / '+list.length+'穴';
 el('name').textContent=(index+1)+'. '+p.name;el('code').textContent=p.code;
 el('progress').style.width=(100*(index+1)/list.length)+'%';
 el('toggle').textContent=reveal?'取穴説明を隠す':'取穴説明を表示';
 if(!reveal){var note=document.createElement('div');note.className='hiddenNote';note.textContent='答えを考えてから「取穴説明を表示」を押してください';el('details').appendChild(note);return;}
 var wrap=document.createElement('div');wrap.className='detail';
 [['取穴部位',p.location],['取り方',p.method],['関連事項',p.related]].forEach(function(pair){if(!pair[1])return;var h=document.createElement('h2');h.textContent=pair[0];var t=document.createElement('p');t.textContent=pair[1];wrap.appendChild(h);wrap.appendChild(t);});
 el('details').appendChild(wrap);
}
function randomPoint(){var list=groups[current],n=index;started=true;if(list.length>1){while(n===index)n=Math.floor(Math.random()*list.length);index=n;}reveal=false;draw();}
function init(){
 try{
  for(var a=0;a<ORDER.length;a++){var k=ORDER[a],opt=document.createElement('option');opt.value=k;opt.textContent=LABELS[k]+'（'+groups[k].length+'穴）';el('meridian').appendChild(opt);}
  el('meridian').addEventListener('change',function(){current=el('meridian').value;index=0;reveal=false;started=false;draw();});
  el('start').addEventListener('click',function(){current=el('meridian').value;index=0;reveal=false;started=true;draw();});
  el('reset').addEventListener('click',function(){index=0;reveal=false;started=false;draw();});
  el('next').addEventListener('click',function(){if(!started)return;if(index<groups[current].length-1){index++;reveal=false;draw();}});
  el('prev').addEventListener('click',function(){if(!started)return;if(index>0){index--;reveal=false;draw();}});
  el('toggle').addEventListener('click',function(){if(!started)return;reveal=!reveal;draw();});
  el('random').addEventListener('click',randomPoint);
  el('shuffleNext').addEventListener('click',randomPoint);
  el('total').textContent=DATA.filter(function(p){return p.location&&p.method;}).length+' / '+DATA.length+'穴 収録';
  draw();
 }catch(e){el('name').textContent='起動エラー: '+e.message;}
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
</script></body></html>
